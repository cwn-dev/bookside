# Bookside: one instance, SQLite on a local bind mount, plain HTTP behind your reverse proxy (which terminates TLS).
# Before the first start: mkdir -p data && sudo chown 1654:1654 data   (the image runs as UID 1654)
# Settings come from the environment or a .env file next to this one (see README).
services:
  bookside:
    build: .
    image: bookside:latest
    restart: unless-stopped
    ports:
      # Defaults to localhost only, for a proxy on the same host. Set BOOKSIDE_BIND=0.0.0.0 if the proxy is elsewhere.
      - "${BOOKSIDE_BIND:-127.0.0.1}:${BOOKSIDE_PORT:-8080}:8080"
    volumes:
      # SQLite in WAL mode needs a local filesystem here (not NFS/SMB).
      - ./data:/data
    environment:
      # "Today" for reading dates and the reading log's local times use the server time zone.
      TZ: ${TZ:-Etc/UTC}
      # Trust X-Forwarded-For/-Proto from the proxy (client IP and scheme). Keep port 8080 reachable only by the proxy.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    stop_grace_period: 30s
